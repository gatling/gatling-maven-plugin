name: build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: 'ubuntu-latest'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Maven
      uses: ./.github/actions/setup-maven
      with:
        aws-role: ${{ vars.AWS_ROLE_PROD_MAVEN_PLUGIN }}
        staging-repository: ${{ vars.MAVEN_STAGING_REPOSITORY }}
        codeartifact-domain: ${{ vars.AWS_CODEARTIFACT_DOMAIN }}
        codeartifact-owner: ${{ vars.AWS_CODEARTIFACT_OWNER }}

    - name: Print Java version
      run: java -version

    - name: Build
      run: mvn --no-transfer-progress -B clean verify

    - name: Clean before caching
      run: find ~/.m2 -name "_remote.repositories" | xargs --no-run-if-empty rm
