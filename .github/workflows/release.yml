name: Release

on:
  push:
    tags:
      - 'v*'

defaults:
  run:
    shell: bash

permissions:
  id-token: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Maven
        uses: ./.github/actions/setup-maven
        with:
          aws-role: ${{ vars.AWS_ROLE_PROD_MAVEN_PLUGIN }}
          staging-repository: ${{ vars.MAVEN_STAGING_REPOSITORY }}
          codeartifact-domain: ${{ vars.AWS_CODEARTIFACT_DOMAIN }}
          codeartifact-owner: ${{ vars.AWS_CODEARTIFACT_OWNER }}
          cache-dependencies: false # No cache for release! We want clean and full release!

      - name: Prepare environment
        env:
          SONATYPE_PGP_SECRET: ${{ secrets.SONATYPE_PGP_SECRET }}
        run: |
          echo -n "$SONATYPE_PGP_SECRET" | base64 --decode | gpg --batch --import

      - name: Deploy
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SONATYPE_PGP_PASSPHRASE }}
          STAGING_REPOSITORY: ${{ vars.MAVEN_STAGING_REPOSITORY }}
        run: |
          mvn --batch-mode deploy -Dgpg.passphrase="${MAVEN_GPG_PASSPHRASE}" -PRelease -DaltReleaseDeploymentRepository="${STAGING_REPOSITORY}"
